name: Gent release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: claurst-windows-x86_64
            ext: .exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: claurst-linux-x86_64
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: claurst-linux-aarch64
            ext: ""
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: claurst-macos-x86_64
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: claurst-macos-aarch64
            ext: ""
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Test the Gent ACP surface
        if: ${{ !matrix.cross && matrix.target == 'x86_64-unknown-linux-gnu' }}
        working-directory: src-rust
        run: cargo test --locked -p claurst-acp -p claurst-query --lib
      - name: Build
        if: ${{ !matrix.cross }}
        working-directory: src-rust
        run: cargo build --release --locked --package claurst --target ${{ matrix.target }}
      - name: Build (cross)
        if: matrix.cross
        working-directory: src-rust
        run: |
          cat > Cross.toml << 'TOML'
          [target.aarch64-unknown-linux-gnu]
          pre-build = [
            "dpkg --add-architecture $CROSS_DEB_ARCH",
            "apt-get update",
            "apt-get install -y pkg-config libasound2-dev:$CROSS_DEB_ARCH"
          ]
          TOML
          cross build --release --locked --package claurst --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          dir="$PWD/src-rust/target/${{ matrix.target }}/release"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            (cd "$dir" && 7z a "$PWD/../../../../dist/${{ matrix.artifact }}.zip" claurst.exe >/dev/null)
          else
            tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C "$dir" claurst
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * | tee SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" artifacts/* --repo "${{ github.repository }}" --title "${{ inputs.tag }}" --notes "Gent build of Claurst with the Gent ACP extensions."
